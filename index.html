<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Menu — Home Food Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg: #232921;
    --board-bg-2: #1b201a;
    --frame: #6b4a32;
    --frame-dark: #4a3121;
    --chalk-white: #f4f1e6;
    --chalk-mustard: #e8b84b;
    --chalk-rust: #c0563a;
    --chalk-sage: #8ca678;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: #14100c;
    background-image: radial-gradient(circle at 50% 0%, #241b13, #14100c 70%);
    font-family:'Work Sans', sans-serif;
    color: var(--chalk-white);
    display:flex;
    justify-content:center;
    padding: 20px 12px 60px;
  }

  .frame{
    width:100%;
    max-width: 520px;
    background:
      repeating-linear-gradient(115deg, var(--frame) 0 6px, var(--frame-dark) 6px 12px);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(0,0,0,0.25);
  }

  .board{
    background: var(--board-bg);
    background-image:
      radial-gradient(rgba(244,241,230,0.03) 1px, transparent 1px),
      radial-gradient(rgba(244,241,230,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 2px 3px;
    border-radius: 8px;
    padding: 22px 16px 18px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5), inset 0 0 2px rgba(244,241,230,0.15);
  }

  header{
    text-align:center;
    margin-bottom: 18px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--chalk-sage);
    opacity: 0.85;
  }

  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 44px;
    margin: 2px 0 6px;
    color: var(--chalk-white);
    text-shadow: 0 0 1px rgba(244,241,230,0.3);
  }

  .underline{
    width: 210px;
    height: 14px;
    margin: 0 auto;
  }
  .underline path{
    fill:none;
    stroke: var(--chalk-mustard);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: draw 1.1s ease-out 0.2s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .sub{
    font-size: 12.5px;
    color: rgba(244,241,230,0.55);
    margin-top: 4px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 10px;
  }

  .card{
    position:relative;
    border: 1.5px dashed rgba(244,241,230,0.28);
    border-radius: 6px;
    padding: 12px 10px 10px;
    min-height: 132px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .day-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--chalk-mustard);
    border: 1px solid rgba(232,184,75,0.5);
    border-radius: 3px;
    padding: 1px 6px;
    display:inline-block;
    width: fit-content;
    margin-bottom: 8px;
  }

  .meal-name{
    font-family:'Caveat', cursive;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.15;
    color: var(--chalk-white);
    outline: none;
    cursor: text;
  }
  .meal-name:focus{ color: var(--chalk-mustard); }

  .meal-desc{
    font-size: 11.5px;
    color: rgba(244,241,230,0.6);
    margin-top: 4px;
    line-height: 1.4;
    outline: none;
    cursor: text;
    flex-grow: 1;
  }
  .meal-desc:focus{ color: rgba(244,241,230,0.85); }

  .card-foot{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .opt-dots{
    display:flex;
    gap: 4px;
  }
  .opt-dots span{
    width:5px; height:5px; border-radius:50%;
    background: rgba(244,241,230,0.25);
  }
  .opt-dots span.active{ background: var(--chalk-sage); }

  .swap-btn{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1.5px solid rgba(244,241,230,0.35);
    background: transparent;
    color: var(--chalk-white);
    font-size: 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    flex-shrink:0;
  }
  .swap-btn:hover{ border-color: var(--chalk-mustard); color: var(--chalk-mustard); }
  .swap-btn:active{ transform: scale(0.88) rotate(120deg); }

  .erase .meal-name, .erase .meal-desc{
    animation: erase 0.28s ease forwards;
  }
  .write .meal-name, .write .meal-desc{
    animation: write 0.32s ease forwards;
  }
  @keyframes erase{
    to{ opacity:0; filter: blur(3px); transform: translateX(3px); }
  }
  @keyframes write{
    from{ opacity:0; filter: blur(3px); transform: translateX(-3px); }
    to{ opacity:1; filter: blur(0); transform: translateX(0); }
  }

  .dust{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background: rgba(244,241,230,0.8);
    pointer-events:none;
    animation: scatter 0.5s ease-out forwards;
  }
  @keyframes scatter{
    to{ transform: translate(var(--dx), var(--dy)); opacity:0; }
  }

  footer{
    text-align:center;
    font-size: 11px;
    color: rgba(244,241,230,0.4);
    margin-top: 16px;
    font-family:'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="board">
    <header>
      <div class="eyebrow">home food menu</div>
      <h1>This Week's Menu</h1>
      <svg class="underline" viewBox="0 0 210 14">
        <path d="M6 8 C 40 2, 80 12, 110 6 S 170 2, 204 8"/>
      </svg>
      <div class="sub">Tap ↻ to swap in another option · tap any text to edit it</div>
    </header>

    <div class="grid" id="grid"></div>

    <footer>chalk resets on refresh — make it yours</footer>
  </div>
</div>

<script>
const days = [
  { tag:"MON", options:[
    {name:"Beef Stir-Fry", desc:"broccoli, garlic, rice"},
    {name:"Chicken Fajita Bowls", desc:"peppers, onion, lime"},
    {name:"Tofu Stir-Fry", desc:"veggies, sesame, rice"}
  ]},
  { tag:"TUE", options:[
    {name:"Spaghetti Bolognese", desc:"slow beef ragu, parmesan"},
    {name:"Baked Ziti", desc:"ricotta, mozzarella, marinara"},
    {name:"Zucchini Marinara", desc:"noodles, basil, chili flake"}
  ]},
  { tag:"WED", options:[
    {name:"Grilled Salmon", desc:"lemon rice, greens"},
    {name:"Shrimp Tacos", desc:"cabbage slaw, chipotle crema"},
    {name:"Red Lentil Curry", desc:"coconut milk, naan"}
  ]},
  { tag:"THU", options:[
    {name:"Chicken Tikka Masala", desc:"basmati rice, garlic naan"},
    {name:"Butter Chickpeas", desc:"tomato cream, rice"},
    {name:"Coconut Chicken Curry", desc:"jasmine rice, cilantro"}
  ]},
  { tag:"FRI", options:[
    {name:"Homemade Pizza Night", desc:"everyone builds their own"},
    {name:"Loaded Nachos", desc:"black beans, cheese, salsa"},
    {name:"Calzones", desc:"ricotta, pepperoni, marinara dip"}
  ]},
  { tag:"SAT", options:[
    {name:"BBQ Ribs", desc:"coleslaw, cornbread"},
    {name:"Grilled Chicken Skewers", desc:"peppers, yogurt sauce"},
    {name:"Portobello Burgers", desc:"caramelized onion, aioli"}
  ]},
  { tag:"SUN", options:[
    {name:"Sunday Roast Chicken", desc:"potatoes, roasted carrots"},
    {name:"Pot Roast", desc:"root veg, pan gravy"},
    {name:"Vegetable Pot Pie", desc:"flaky crust, herb gravy"}
  ]}
];

const grid = document.getElementById('grid');

days.forEach((day, dayIdx) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = 0;

  const dots = day.options.map((_, i) =>
    `<span class="${i===0 ? 'active':''}"></span>`).join('');

  card.innerHTML = `
    <span class="day-tag">${day.tag}</span>
    <div class="meal-name" contenteditable="true" spellcheck="false">${day.options[0].name}</div>
    <div class="meal-desc" contenteditable="true" spellcheck="false">${day.options[0].desc}</div>
    <div class="card-foot">
      <div class="opt-dots">${dots}</div>
      <button class="swap-btn" aria-label="Swap meal">↻</button>
    </div>
  `;

  const nameEl = card.querySelector('.meal-name');
  const descEl = card.querySelector('.meal-desc');
  const dotsEl = card.querySelectorAll('.opt-dots span');
  const btn = card.querySelector('.swap-btn');

  btn.addEventListener('click', () => {
    spawnDust(btn);
    let idx = (parseInt(card.dataset.index) + 1) % day.options.length;
    card.dataset.index = idx;

    card.classList.add('erase');
    setTimeout(() => {
      nameEl.textContent = day.options[idx].name;
      descEl.textContent = day.options[idx].desc;
      dotsEl.forEach((d,i) => d.classList.toggle('active', i===idx));
      card.classList.remove('erase');
      card.classList.add('write');
      setTimeout(() => card.classList.remove('write'), 340);
    }, 260);
  });

  grid.appendChild(card);
});

function spawnDust(btn){
  const rect = btn.getBoundingClientRect();
  for(let i=0;i<8;i++){
    const dot = document.createElement('div');
    dot.className = 'dust';
    const angle = Math.random()*Math.PI*2;
    const dist = 14 + Math.random()*18;
    dot.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
    dot.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
    dot.style.left = (rect.left + rect.width/2) + 'px';
    dot.style.top = (rect.top + rect.height/2) + 'px';
    dot.style.position = 'fixed';
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), 520);
  }
}
</script>

</body>
</html>
